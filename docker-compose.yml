x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    SOURCE_DB_HOST: postgres-source
    SOURCE_DB_PORT: 5432
    SOURCE_DB_NAME: news_source
    SOURCE_DB_USER: news
    SOURCE_DB_PASSWORD: news
    DWH_DB_HOST: postgres-dwh
    DWH_DB_PORT: 5432
    DWH_DB_NAME: news_dwh
    DWH_DB_USER: news
    DWH_DB_PASSWORD: news
    LAKE_ENDPOINT_URL: http://minio:9000
    LAKE_ACCESS_KEY: minioadmin
    LAKE_SECRET_KEY: minioadmin
    SCRAPER_MODE: fixture
    SLACK_WEBHOOK_URL: ""   # optional — set to a real Slack incoming webhook URL to enable alerts
    SMTP_HOST: "smtp.gmail.com"              # optional — e.g. smtp.gmail.com
    SMTP_PORT: "587"
    SMTP_USER: "vincentrumt@gmail.com"
    SMTP_PASSWORD: "yjykzjelypplrafo"
    ALERT_EMAIL_TO: "bryantegarm@gmail.com"         # optional — recipient address
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./dbt:/opt/airflow/dbt
    - ./dbt/profiles.yml.example:/home/airflow/.dbt/profiles.yml
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    postgres-source:
      condition: service_healthy
    postgres-dwh:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres-source:
    image: postgres:16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_source
    ports:
      - "5433:5432"
    volumes:
      - ./sql/01_source_ddl.sql:/docker-entrypoint-initdb.d/01_source_ddl.sql
      - pg-source-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_source"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-dwh:
    image: postgres:16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_dwh
    ports:
      - "5434:5432"
    volumes:
      - ./sql/02_dwh_ddl.sql:/docker-entrypoint-initdb.d/02_dwh_ddl.sql
      - pg-dwh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_dwh"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API   -> simulates GCS
      - "9001:9001"   # Console  -> http://localhost:9001
    volumes:
      - minio-data:/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Bryan --lastname Tegar --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  api:
    build:
      context: ./api
    environment:
      DWH_DB_HOST: postgres-dwh
      DWH_DB_PORT: 5432
      DWH_DB_NAME: news_dwh
      DWH_DB_USER: news
      DWH_DB_PASSWORD: news
    ports:
      - "8000:8000"   # Swagger docs: http://localhost:8000/docs
    depends_on:
      postgres-dwh:
        condition: service_healthy
    restart: unless-stopped   # safety net if it ever races ahead of the DB anyway

volumes:
  pg-source-data:
  pg-dwh-data:
  pg-airflow-data:
  minio-data:
  airflow-logs:
